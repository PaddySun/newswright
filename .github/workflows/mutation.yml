# 变异测试（mutmut）：全量基线测量，不进合并硬门（快门在 ci.yml）。
# 触发：仅 workflow_dispatch 手动按钮（2026-10-03 新政：零 tag 流水账）。
# 关键实现纪律（勿回退）：
#   1. setup.cfg 必须先于任何 mutmut 命令存在（3.8 在导入期加载配置）；
#   2. 配置键 source_paths=app（整包，沙箱模型决定不可分片）+ pytest_add_cli_args_test_selection=tests/；
#   3. run 步骤 set +e 包裹退出码；判定权在清单类别判定步骤；
#   4. 清单与报告一律 .meta 直读（mutmut results CLI 出过空输出故障，且默认视图隐藏 killed）；
#   5. 变异 job 非 editable 安装（prompts 已随 package-data 进包）；
#   6. Pages 部署拆独立 job——continue-on-error 的 job 不允许 deploy-pages（首次 dispatch 踩坑）。
# 展示：报告经 Pages 部署到 https://paddysun.github.io/newswright/（badge 直达）。
name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-pages
  cancel-in-progress: false

env:
  DeepSeekAPIKey: ci-dummy
  MoarkAPIKey: ci-dummy

jobs:
  mutants:
    name: mutmut-full
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[dev]"
      - name: mutmut run（全量 app/）
        run: |
          printf '[mutmut]\nsource_paths=app\npytest_add_cli_args_test_selection=tests/\n' > setup.cfg
          mutmut --version || true
          set +e
          mutmut run > mutmut.log 2>&1
          rc=$?
          set -e
          echo "mutmut exit=$rc"
          tail -30 mutmut.log
          tail -8 mutmut.log | while IFS= read -r l; do printf '::error title=mutmutlog::%s\n' "${l:0:220}"; done || true
          exit 0
      - name: 生成全量清单与 HTML 报告 v3（.meta 直读 + 覆盖测试 + 源码链接 + 推断算子）
        if: always()
        continue-on-error: true
        run: |
          python scripts/mutmut_report.py --out mutmut-report.html --txt-out mutmut-results-full.txt \
            --meta-dir mutants --stats mutants/mutmut-stats.json \
            --ref "${{ github.ref_name }}@${{ github.sha }}" --sha "${{ github.sha }}" --max-diffs 800
      - name: 清单类别判定（绿=数据完整，红=未产出任何变异体判定）
        if: always()
        run: grep -qiE 'survived|killed' mutmut-results-full.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: mutmut-full
          path: mutmut-results-full.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: mutmut-report
          path: mutmut-report.html
          if-no-files-found: ignore
      - name: 收集 mutmut 缓存（stats + .meta 供本地复核）
        if: always()
        run: |
          mkdir -p cache-out
          find . -maxdepth 4 \( -name '*mutmut-stats*' -o -name '*.meta' \) -not -path './.git/*' -exec cp --parents {} cache-out/ \; 2>/dev/null || true
          ls -la cache-out || true
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: mutmut-cache
          path: cache-out
          if-no-files-found: ignore

  deploy-pages:
    name: deploy-report
    needs: mutants
    if: always()
    runs-on: ubuntu-24.04
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mutmut-report
      - name: 组装站点（报告为首页；缺失时放占位说明页）
        run: |
          mkdir -p site
          if [ -f mutmut-report.html ]; then cp mutmut-report.html site/index.html
          else printf '<h1>mutmut report missing / 报告未生成（本次 run 未产出）</h1>' > site/index.html; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

# 变异测试（mutmut）：全量基线测量，不进合并硬门（快门在 ci.yml）。
# 触发（2026-10-03 新政：零 tag 流水账）——仅 workflow_dispatch 手动按钮（默认分支）。
# 关键实现纪律（冒烟链 + 两轮基线的教训，勿回退）：
#   1. mutmut 在模块导入期即加载配置——setup.cfg 必须先于任何 mutmut 命令存在（含 --version）；
#   2. 配置键为 source_paths + pytest_add_cli_args_test_selection（旧键已弃用并被忽略）；
#   3. 沙箱只装载 source_paths 内容——跨模块 import 决定了 source_paths 必须整包 app/，不可分片；
#   4. run 步骤 set +e 包裹退出码（幸存类别本就非零退出），判定权在幸存者清单步骤；
#   5. `mutmut results` 默认视图隐藏 killed——清单必须带 --all（否则总变异体/杀死率全是假象）；
#   6. 变异 job 用非 editable 安装（prompts 已随 package-data 进包）。
# 展示：HTML 报告（scripts/mutmut_report.py）上传 artifact 并经 GitHub Actions 部署到 Pages
#       （https://paddysun.github.io/newswright/ 恒为最新，README badge 直达）。
name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # Pages 部署（Source 已配置为 GitHub Actions）
  id-token: write

concurrency:
  group: mutation-pages
  cancel-in-progress: false

env:
  DeepSeekAPIKey: ci-dummy
  MoarkAPIKey: ci-dummy

jobs:
  mutants:
    name: mutmut-full
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[dev]"
      - name: mutmut run（全量 app/）
        run: |
          printf '[mutmut]\nsource_paths=app\npytest_add_cli_args_test_selection=tests/\n' > setup.cfg
          mutmut --version || true
          set +e
          mutmut run > mutmut.log 2>&1
          rc=$?
          set -e
          echo "mutmut exit=$rc"
          tail -30 mutmut.log
          tail -8 mutmut.log | while IFS= read -r l; do printf '::error title=mutmutlog::%s\n' "${l:0:220}"; done || true
          exit 0
      - name: 全量清单（--all：默认视图隐藏 killed，勿去掉）
        if: always()
        run: |
          mutmut results --all | tee mutmut-results-full.txt || true
          echo '--- 清单内容 ---'
          cat mutmut-results-full.txt || true
          tail -3 mutmut-results-full.txt | while IFS= read -r l; do printf '::error title=mutmutres::%s\n' "${l:0:220}"; done || true
          grep -qiE 'survived|timeout|suspicious|killed' mutmut-results-full.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: mutmut-full
          path: mutmut-results-full.txt
          if-no-files-found: ignore
      - name: 生成 HTML 报告（双语/指标卡/折叠/一键复制，缓存仍在场时取 diff）
        if: always()
        continue-on-error: true
        run: python scripts/mutmut_report.py --out mutmut-report.html --results-file mutmut-results-full.txt --ref "manual-dispatch" --max-diffs 800
      - name: 收集 mutmut 缓存（.meta 供本地 mutmut show / results 复核）
        if: always()
        run: |
          mkdir -p cache-out
          find . -maxdepth 4 \( -name '.mutmut-cache' -o -name '*mutmut-stats*' -o -name '*.meta' \) -not -path './.git/*' -exec cp --parents {} cache-out/ \; 2>/dev/null || true
          ls -la cache-out || true
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: mutmut-report
          path: mutmut-report.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: mutmut-cache
          path: cache-out
          if-no-files-found: ignore
      # ---- Pages 部署（报告恒为最新，badge 直达）----
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: always()
      - name: 组装站点（报告为首页；缺失时放占位说明页）
        if: always()
        run: |
          mkdir -p site
          if [ -f mutmut-report.html ]; then cp mutmut-report.html site/index.html
          else printf '<h1>mutmut report missing / 报告未生成（本次 run 异常）</h1>' > site/index.html; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: always()
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        if: always()

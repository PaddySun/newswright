[project]
name = "newswright"
version = "0.1.0"
description = "Newswright minimal full-pipeline demo backend (RSS ingest -> rules -> LLM scoring -> AI author writing)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mutmut>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }
